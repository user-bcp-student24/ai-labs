quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.jackson.fail-on-unknown-properties=false
workshop.token.secret=${WORKSHOP_TOKEN_SECRET}
# Bootstrap: sin cuentas de demostracion por defecto; activar solo en entornos no productivos.
workshop.bootstrap.demo-users.enabled=false
%test.workshop.token.secret=test-only-token-secret
%test.auth.db.url=jdbc:sqlite:target/auth-test.db
%test.workshop.test-user.password=test-only-user-password
